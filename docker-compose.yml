services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fanmilk
      POSTGRES_USER: fanmilk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fanmilk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanmilk -d fanmilk"]
      interval: 10s
      timeout: 5s
      retries: 10

  vendor-bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql+psycopg://fanmilk:${POSTGRES_PASSWORD}@postgres:5432/fanmilk
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEPOSITAIRE_EMAIL: ${DEPOSITAIRE_EMAIL:-}
      DEPOSITAIRE_PASSWORD: ${DEPOSITAIRE_PASSWORD:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET}
    ports:
      - "5000:5000"

volumes:
  fanmilk_postgres_data:
