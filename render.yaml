services:
  - type: web
    name: vendor-bot
    env: python
    runtime: python-3.11.9
    plan: free
    region: oregon
    buildCommand: "python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
    startCommand: "flask --app app.main init-db && gunicorn app.main:app --bind 0.0.0.0:$PORT --workers 2 --threads 4"
