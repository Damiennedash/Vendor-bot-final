services:
  - type: web
    name: vendor-bot
    runtime: python
    plan: free
    healthCheckPath: /healthz
    region: oregon
    buildCommand: "python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
    startCommand: "flask --app app.main init-db && gunicorn app.main:app --bind 0.0.0.0:$PORT --workers 1 --threads 4"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://fanmilk-togo-dashboard.djatadamienne5.chatgpt.site,http://localhost:3000
      - key: FRONTEND_URL
        value: https://fanmilk-togo.damiennedash.workers.dev
      - key: RESEND_API_KEY
        sync: false
      - key: RESET_EMAIL_FROM
        value: FanMilk Togo <onboarding@resend.dev>
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEPOSITAIRE_EMAIL
        sync: false
      - key: DEPOSITAIRE_PASSWORD
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
